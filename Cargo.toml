[package]
name = "greed-compute"
version = "0.1.0"
edition = "2021"
description = "Ephemeral ML sandbox for LLM agents — run PyTorch code via API"
authors = ["Aditya Khalkar"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Session management
uuid = { version = "1", features = ["v4"] }
dashmap = "6"

# Database for API keys and usage tracking
rusqlite = { version = "0.32", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Base64 for file uploads
base64 = "0.22"

# Temp filesystem
tempfile = "3"

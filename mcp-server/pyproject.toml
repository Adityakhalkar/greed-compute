[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greed-compute-mcp"
version = "0.1.0"
description = "MCP server for greed-compute — run Python/ML code from Claude, Cursor, and any MCP client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
greed-compute-mcp = "greed_compute_mcp:main"

[project.urls]
Homepage = "https://github.com/Adityakhalkar/greed-compute"

[tool.hatch.build.targets.wheel]
packages = ["greed_compute_mcp"]
